name: CI
# Nama workflow yang muncul di tab "Actions" GitHub dan di badge.

on:
  push:
    branches: [main]
  pull_request:
# Kapan berjalan: setiap push ke branch main, dan setiap Pull Request (ke branch mana pun).

permissions:
  contents: read
# Keamanan (least privilege): token bawaan workflow hanya boleh MEMBACA repo.
# Kalau ada dependency jahat yang menjalankan kode di CI, ia tidak bisa mengubah repo Anda.

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
# Kalau Anda push dua kali berturut-turut ke branch yang sama, run lama dibatalkan.
# Menghemat menit CI dan tidak menumpuk antrean.

jobs:
  frontend: # nama job (bebas)
    runs-on: ubuntu-latest # jenis mesin: Linux bersih milik GitHub (gratis untuk repo publik)
    env:
      NEXT_PUBLIC_API_URL: http://localhost:4000
      BACKEND_URL: http://localhost:4000
    timeout-minutes: 10 # kalau macet lebih dari 10 menit, hentikan otomatis
    defaults:
      run:
        working-directory: frontend
        # Semua perintah `run:` dijalankan di dalam folder frontend/,
        # karena package.json ada di sana, bukan di root.
    steps:
      - uses: actions/checkout@v4
        # Mengunduh isi repo ke mesin CI. Tanpa ini mesinnya kosong.

      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          # Versi Node dibaca dari .nvmrc, jadi lokal dan CI selalu sama.
          cache: npm
          cache-dependency-path: frontend/package-lock.json
          # Menyimpan cache ~/.npm supaya run berikutnya tidak mengunduh ulang semua paket.

      - run: npm ci
        # Install persis sesuai package-lock.json. Lebih ketat dan lebih cepat dari `npm install`,
        # dan gagal kalau lockfile tidak sinkron dengan package.json.

      - run: npm run check
        # Build production. Env dummy diberikan karena scr/env.ts dan src/env.server.ts (zod) mewajibkannya.
        # Nilainya tidak rahasia, jadi aman ditulis di file.

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: emptrack
          POSTGRES_USER: emptrack
          POSTGRES_PASSWORD: secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U emptrack -d emptrack"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: emptrack
      DB_USERNAME: emptrack
      DB_PASSWORD: secret
      CACHE_STORE: redis
      REDIS_CLIENT: phpredis
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, xml, ctype, iconv, intl, pdo_pgsql, pgsql, redis, bcmath, curl, zip
          coverage: none

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('backend/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Prepare application environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run Laravel Pint
        run: ./vendor/bin/pint --test

      - name: Run Larastan (PHPStan)
        run: ./vendor/bin/phpstan analyse --no-progress --memory-limit=512M

      - name: Run database migrations
        run: php artisan migrate --force

      - name: Run Pest tests
        run: php artisan test
